<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartWay 家庭作业平台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: #f4f7fb;
    color: #1f2937;
  }
  .app {
    min-height: 100vh;
    display: grid;
    grid-template-rows: 64px 1fr;
  }
  header {
    display: flex;
    align-items: center;
    padding: 0 20px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
  }
  .brand {
    font-size: 20px;
    font-weight: 700;
  }
  .main {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 0;
  }
  aside {
    height: calc(100vh - 64px);
    display: grid;
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 12px;
    overflow: hidden;
    background:
      radial-gradient(circle at 18% 0%, rgba(96, 165, 250, 0.18), transparent 30%),
      linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
    border-right: 1px solid rgba(148, 163, 184, 0.28);
    box-shadow: inset -1px 0 0 rgba(255,255,255,0.8);
  }
  .child-section {
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 10px;
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.24);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.82);
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
    backdrop-filter: blur(12px);
  }
  .child-section + .child-section {
    border-top: 1px solid rgba(148, 163, 184, 0.24);
  }
  .side-title {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .side-title::before {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 8px 18px rgba(37, 99, 235, 0.24);
  }
  .child-section:nth-child(1) .side-title::before {
    content: "跃";
    background: linear-gradient(135deg, #2563eb, #7c3aed);
  }
  .child-section:nth-child(2) .side-title::before {
    content: "晓";
    background: linear-gradient(135deg, #f97316, #ec4899);
  }
  .task-list {
    flex: 1;
    min-height: 0;
    display: grid;
    gap: 6px;
    align-content: start;
    overflow-y: auto;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(37, 99, 235, 0.34) transparent;
  }
  .task-list::-webkit-scrollbar { width: 6px; }
  .task-list::-webkit-scrollbar-thumb {
    background: rgba(37, 99, 235, 0.24);
    border-radius: 999px;
  }
  .task-btn {
    position: relative;
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    background: #fff;
    border-radius: 12px;
    padding: 9px 10px 9px 14px;
    cursor: pointer;
    box-shadow: 0 5px 14px rgba(15, 23, 42, 0.045);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .task-btn::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 3px;
    border-radius: 999px;
    background: #bfdbfe;
  }
  .task-btn:hover {
    transform: translateY(-1px);
    border-color: #93c5fd;
    background: #f8fbff;
    box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
  }
  .task-btn.active {
    border-color: #2563eb;
    background: linear-gradient(135deg, #eff6ff, #eef2ff);
    box-shadow: 0 14px 30px rgba(37, 99, 235, 0.18);
  }
  .task-btn.active::before { background: #2563eb; }
  .task-name {
    font-size: 14px;
    font-weight: 800;
    color: #111827;
  }
  .empty {
    color: #94a3b8;
    font-size: 14px;
    line-height: 1.7;
    padding: 18px;
    background: rgba(248, 250, 252, 0.82);
    border: 1px dashed #cbd5e1;
    border-radius: 16px;
    text-align: center;
  }
  .workspace {
    min-height: 0;
    padding: 16px;
  }
  iframe {
    width: 100%;
    height: calc(100vh - 96px);
    border: 0;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }
  .placeholder {
    height: calc(100vh - 96px);
    display: grid;
    place-items: center;
    background: #fff;
    border-radius: 16px;
    color: #6b7280;
  }
  @media (max-width: 760px) {
    .main { grid-template-columns: 1fr; }
    aside {
      height: 44vh;
      padding: 10px;
      border-right: 0;
      border-bottom: 1px solid #e5e7eb;
    }
    iframe, .placeholder { height: 70vh; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">SmartWay 家庭作业</div>
  </header>

  <main class="main">
    <aside id="taskNav"></aside>
    <section class="workspace" id="workspace"></section>
  </main>
</div>

<script>
const CHILD_ORDER = ['yuyue', 'yuxiao'];
let children = [];
const tasksByChild = {};
let currentTaskKey = null;

const taskNavEl = document.getElementById('taskNav');
const workspaceEl = document.getElementById('workspace');

async function apiGet(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`请求失败：${response.status}`);
  return response.json();
}

async function init() {
  try {
    children = await apiGet('/api/children');
    await Promise.all(children.map(async child => {
      tasksByChild[child.id] = await apiGet(`/api/children/${encodeURIComponent(child.id)}/tasks`);
    }));
    renderTaskNav();
    if (!openTaskFromUrl()) openFirstTask();
  } catch (error) {
    console.error(error);
    taskNavEl.innerHTML = '<div class="empty">任务加载失败</div>';
    renderPlaceholder('后端服务连接失败，请确认已执行 npm start');
  }
}

function getOrderedChildren() {
  const byId = Object.fromEntries(children.map(child => [child.id, child]));
  return CHILD_ORDER.map(id => byId[id]).filter(Boolean);
}

function getTaskUrl(child, task) {
  return `#/tasks/${encodeURIComponent(child.id)}/${encodeURIComponent(task.id)}`;
}

function safeDecode(value) {
  try {
    return decodeURIComponent(value || '');
  } catch (error) {
    return '';
  }
}

function getTaskFromUrl() {
  const parts = window.location.hash.replace(/^#\/?/, '').split('/');
  if (parts.length !== 3 || parts[0] !== 'tasks') return null;

  const childId = safeDecode(parts[1]);
  const taskId = safeDecode(parts[2]);
  const child = children.find(item => item.id === childId);
  const task = (tasksByChild[childId] || []).find(item => item.id === taskId);
  return child && task ? { child, task } : null;
}

function openTaskFromUrl() {
  const target = getTaskFromUrl();
  if (!target) return false;
  openTask(target.child, target.task, { updateUrl: false });
  return true;
}

function renderTaskNav() {
  taskNavEl.innerHTML = '';
  getOrderedChildren().forEach(child => {
    const section = document.createElement('section');
    section.className = 'child-section';

    const title = document.createElement('div');
    title.className = 'side-title';
    title.textContent = `${child.name}的任务`;

    const list = document.createElement('div');
    list.className = 'task-list';

    const tasks = tasksByChild[child.id] || [];
    if (tasks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '暂无任务';
      list.appendChild(empty);
    } else {
      tasks.forEach(task => list.appendChild(createTaskButton(child, task)));
    }

    section.append(title, list);
    taskNavEl.appendChild(section);
  });
}

function createTaskButton(child, task) {
  const taskKey = `${child.id}:${task.id}`;
  const button = document.createElement('button');
  button.className = 'task-btn' + (taskKey === currentTaskKey ? ' active' : '');
  button.dataset.taskKey = taskKey;

  const name = document.createElement('div');
  name.className = 'task-name';
  name.textContent = task.name;

  const desc = document.createElement('div');
  desc.className = 'task-desc';
  desc.textContent = task.description || task.type || '';

  button.append(name, desc);
  button.addEventListener('click', () => openTask(child, task));
  return button;
}

function openFirstTask() {
  for (const child of getOrderedChildren()) {
    const task = (tasksByChild[child.id] || [])[0];
    if (task) {
      openTask(child, task, { replaceUrl: true });
      return;
    }
  }
  renderPlaceholder('暂无任务');
}

function openTask(child, task, options = {}) {
  const nextTaskKey = `${child.id}:${task.id}`;
  const existingFrame = workspaceEl.querySelector('iframe');
  if (currentTaskKey === nextTaskKey && existingFrame) return;

  currentTaskKey = nextTaskKey;
  taskNavEl.querySelectorAll('.task-btn').forEach(button => {
    button.classList.toggle('active', button.dataset.taskKey === currentTaskKey);
  });
  workspaceEl.innerHTML = '';
  const iframe = document.createElement('iframe');
  iframe.src = task.entry;
  iframe.title = `${child.name} - ${task.name}`;
  workspaceEl.appendChild(iframe);

  const updateUrl = options.updateUrl !== false;
  const nextUrl = getTaskUrl(child, task);
  if (updateUrl && window.location.hash !== nextUrl) {
    const method = options.replaceUrl ? 'replaceState' : 'pushState';
    window.history[method](null, '', nextUrl);
  }
}

function renderPlaceholder(text) {
  workspaceEl.innerHTML = '';
  const placeholder = document.createElement('div');
  placeholder.className = 'placeholder';
  placeholder.textContent = text;
  workspaceEl.appendChild(placeholder);
}

window.addEventListener('hashchange', openTaskFromUrl);
window.addEventListener('popstate', openTaskFromUrl);

init();
</script>
</body>
</html>
