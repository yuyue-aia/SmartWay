<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>余晓 · 鸡兔同笼变式</title>
<link rel="stylesheet" href="/shared/base-conversion-task.css" />
<style>
  .formula-card {
    display: grid;
    gap: 6px;
    width: 100%;
    padding: 16px;
    border: 1px solid rgba(37, 99, 235, 0.18);
    border-radius: 18px;
    background: linear-gradient(135deg, #eff6ff, #f8fafc);
    color: #334155;
    font-size: 14px;
    line-height: 1.7;
  }
  .formula-title { color: #1d4ed8; font-weight: 900; }
  .question-card { min-height: 240px; }
  .prompt { min-height: 110px; line-height: 1.8; }
  .answer-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .answer-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .answer-cell label {
    font-size: 13px;
    color: #475569;
    font-weight: 800;
    min-width: 28px;
  }
  .answer-input { width: 100%; }
  .unit {
    display: inline-flex;
    align-items: center;
    padding: 0 10px;
    border-radius: 12px;
    background: #e0e7ff;
    color: #3730a3;
    font-weight: 900;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div>
      <div class="eyebrow">数学专项 · 鸡兔同笼</div>
      <h1 id="title">余晓 · 鸡兔同笼变式</h1>
      <p class="subtitle">5 道鸡兔同笼经典变式题：标准型、自行车 / 三轮车、大船小船、答题扣分。每题答案均为整数，可口算。</p>
    </div>
    <div class="score-card">
      <div class="score-number" id="score">0/5</div>
      <div class="score-label">当前得分</div>
    </div>
  </section>

  <section class="toolbar">
    <div class="formula-card">
      <div class="formula-title">解题提醒（假设法）</div>
      <div>① 假设全部是“脚少的”那种：先算出假设总脚数，与实际比较得到差。</div>
      <div>② 每替换 1 只“脚少的”为“脚多的”，总脚数会增加 = (多脚 − 少脚)。</div>
      <div>③ 差 ÷ 每只多出的脚数 = 脚多动物的只数；总数 − 它 = 脚少动物的只数。</div>
    </div>
  </section>

  <section class="question-grid" id="questionGrid"></section>

  <section class="bottom-actions">
    <div class="save-status" id="saveStatus"></div>
    <div class="actions">
      <button class="btn btn-primary" id="checkBtn">批改</button>
      <button class="btn btn-secondary" id="resetBtn">重做</button>
      <button class="btn btn-secondary" id="saveBtn" disabled>保存成绩</button>
    </div>
  </section>
</div>

<script>
const config = {
  childId: 'yuxiao',
  taskId: 'chicken_rabbit',
  questions: [
    {
      tag: '标准型',
      prompt: '笼子里有鸡和兔共 40 只，从下面数共有 116 只脚。鸡和兔各有多少只？',
      labels: ['鸡', '兔'],
      units: ['只', '只'],
      answer: { 0: 22, 1: 18 }
    },
    {
      tag: '标准型',
      prompt: '笼子里有鸡和兔共 15 只，一共 40 只脚。鸡和兔各有多少只？',
      labels: ['鸡', '兔'],
      units: ['只', '只'],
      answer: { 0: 10, 1: 5 }
    },
    {
      tag: '脚数差',
      prompt: '笼子里有鸡和兔共 30 只，兔的脚比鸡的脚多 12 只。鸡和兔各有多少只？',
      labels: ['鸡', '兔'],
      units: ['只', '只'],
      answer: { 0: 18, 1: 12 }
    },
    {
      tag: '自行车 / 三轮车',
      prompt: '车棚里停着自行车和三轮车一共 25 辆，所有车的轮子总共 60 个。自行车和三轮车各有多少辆？',
      labels: ['自行车', '三轮车'],
      units: ['辆', '辆'],
      answer: { 0: 15, 1: 10 }
    },
    {
      tag: '答题扣分',
      prompt: '一次比赛共 25 道题，答对 1 题得 4 分，答错或不答倒扣 1 分。小红全部作答，最终得 80 分。她答对了多少题？答错了多少题？',
      labels: ['答对', '答错'],
      units: ['题', '题'],
      answer: { 0: 21, 1: 4 }
    }
  ]
};

const stateKey = `smartway.chickenRabbit.${config.childId}.answers`;
const questionSignature = JSON.stringify(config.questions.map(q => ({
  tag: q.tag, prompt: q.prompt, answer: q.answer
})));
let lastResult = null;

const questionGridEl = document.getElementById('questionGrid');
const scoreEl = document.getElementById('score');
const checkBtn = document.getElementById('checkBtn');
const resetBtn = document.getElementById('resetBtn');
const saveBtn = document.getElementById('saveBtn');
const saveStatusEl = document.getElementById('saveStatus');

function loadAnswers() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(stateKey) || 'null');
    if (!saved || saved.signature !== questionSignature || !Array.isArray(saved.answers)) {
      sessionStorage.removeItem(stateKey);
      return [];
    }
    return saved.answers;
  } catch (error) {
    sessionStorage.removeItem(stateKey);
    return [];
  }
}

function saveAnswers() {
  const answers = [...questionGridEl.querySelectorAll('.question-card')].map(card => {
    return [...card.querySelectorAll('.answer-input')].map(input => input.value);
  });
  sessionStorage.setItem(stateKey, JSON.stringify({ signature: questionSignature, answers }));
  saveStatusEl.textContent = '答案已自动保留';
}

function normalizeAnswer(value) {
  return String(value || '').trim().replace(/[^0-9.\-]/g, '');
}

function isCorrectAnswer(inputValue, expected) {
  const num = Number(normalizeAnswer(inputValue));
  return Number.isFinite(num) && Math.abs(num - expected) < 1e-8;
}

function renderQuestions() {
  const savedAnswers = loadAnswers();
  questionGridEl.innerHTML = '';

  config.questions.forEach((question, index) => {
    const card = document.createElement('article');
    card.className = 'question-card';
    card.dataset.index = index;

    const head = document.createElement('div');
    head.className = 'question-head';

    const num = document.createElement('div');
    num.className = 'question-index';
    num.textContent = `第 ${index + 1} 题`;

    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = question.tag;

    head.append(num, badge);

    const prompt = document.createElement('div');
    prompt.className = 'prompt';
    prompt.textContent = question.prompt;

    const answerRow = document.createElement('div');
    answerRow.className = 'answer-row';

    question.labels.forEach((label, fieldIdx) => {
      const cell = document.createElement('div');
      cell.className = 'answer-cell';

      const lab = document.createElement('label');
      lab.textContent = label;

      const input = document.createElement('input');
      input.className = 'answer-input';
      input.type = 'text';
      input.inputMode = 'numeric';
      input.placeholder = `${label}的数量`;
      input.autocomplete = 'off';
      input.dataset.field = String(fieldIdx);
      input.value = (savedAnswers[index] && savedAnswers[index][fieldIdx]) || '';
      input.addEventListener('input', saveAnswers);
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') checkAll();
      });

      const unit = document.createElement('span');
      unit.className = 'unit';
      unit.textContent = question.units[fieldIdx];

      cell.append(lab, input, unit);
      answerRow.appendChild(cell);
    });

    const feedback = document.createElement('div');
    feedback.className = 'feedback';

    card.append(head, prompt, answerRow, feedback);
    questionGridEl.appendChild(card);
  });
}

function checkAll() {
  saveAnswers();
  let correct = 0;
  let answered = 0;
  const wrongItems = [];

  questionGridEl.querySelectorAll('.question-card').forEach(card => {
    const index = Number(card.dataset.index);
    const question = config.questions[index];
    const inputs = card.querySelectorAll('.answer-input');
    const feedback = card.querySelector('.feedback');
    const values = [...inputs].map(input => normalizeAnswer(input.value));

    if (values.every(v => !v)) {
      card.classList.remove('correct', 'wrong');
      feedback.textContent = '';
      return;
    }

    answered += 1;
    const ok = values.every((v, i) => isCorrectAnswer(v, question.answer[i]));
    card.classList.toggle('correct', ok);
    card.classList.toggle('wrong', !ok);

    if (ok) {
      correct += 1;
      feedback.textContent = '正确';
    } else {
      feedback.textContent = '错误';
      wrongItems.push(`第 ${index + 1} 题：${question.prompt}`);
    }
  });

  lastResult = { correct, total: answered, wrongItems };
  scoreEl.textContent = `${correct}/${answered}`;
  saveBtn.disabled = answered === 0;
  saveStatusEl.textContent = answered === 0 ? '还没有填写答案' : `已批改 ${answered} 道题，可保存成绩`;
}

function resetAll() {
  lastResult = null;
  sessionStorage.removeItem(stateKey);
  scoreEl.textContent = `0/${config.questions.length}`;
  saveBtn.disabled = true;
  saveStatusEl.textContent = '';
  questionGridEl.querySelectorAll('.question-card').forEach(card => {
    card.classList.remove('correct', 'wrong');
    card.querySelectorAll('.answer-input').forEach(input => { input.value = ''; });
    card.querySelector('.feedback').textContent = '';
  });
}

async function saveResult() {
  if (!lastResult) return;
  saveBtn.disabled = true;
  saveStatusEl.textContent = '正在保存...';

  try {
    const response = await fetch(`/api/children/${encodeURIComponent(config.childId)}/records`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        taskId: config.taskId,
        total: lastResult.total,
        correct: lastResult.correct,
        wrongItems: lastResult.wrongItems
      })
    });
    if (!response.ok) throw new Error(`保存失败：${response.status}`);
    saveStatusEl.textContent = '成绩已保存';
  } catch (error) {
    console.error(error);
    saveStatusEl.textContent = '保存失败，请确认后端服务正常';
    saveBtn.disabled = false;
  }
}

checkBtn.addEventListener('click', checkAll);
resetBtn.addEventListener('click', resetAll);
saveBtn.addEventListener('click', saveResult);

renderQuestions();
scoreEl.textContent = `0/${config.questions.length}`;
if (loadAnswers().some(Boolean)) {
  saveStatusEl.textContent = '已恢复上次填写的答案';
}
</script>
</body>
</html>
