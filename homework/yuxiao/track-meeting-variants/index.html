<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>余晓相遇追及变式</title>
<link rel="stylesheet" href="/shared/base-conversion-task.css" />
<style>
  .formula-card {
    display: grid;
    gap: 8px;
    width: 100%;
    padding: 16px;
    border: 1px solid rgba(37, 99, 235, 0.18);
    border-radius: 18px;
    background: linear-gradient(135deg, #eff6ff, #f8fafc);
    color: #334155;
    font-size: 14px;
    line-height: 1.7;
  }
  .formula-title {
    color: #1d4ed8;
    font-weight: 900;
  }
  .question-card {
    min-height: 280px;
  }
  .prompt {
    min-height: 132px;
    line-height: 1.8;
  }
  .prompt-line {
    display: block;
  }
  .answer-input {
    text-transform: none;
  }
  .unit {
    display: inline-flex;
    align-items: center;
    padding: 0 14px;
    border-radius: 14px;
    background: #e0e7ff;
    color: #3730a3;
    font-weight: 900;
  }
  .solution {
    margin-top: 8px;
    color: #475569;
    font-size: 13px;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div>
      <div class="eyebrow">数学专项 · 相遇追及</div>
      <h1 id="title">余晓 · 相遇追及三类题型</h1>
      <p class="subtitle">精选 20 道相遇追及变式题，10 类考点每类 2 道，覆盖直线追及、不同时出发、反求、相遇、环形和多人问题。答案只填数字。</p>
    </div>
    <div class="score-card">
      <div class="score-number" id="score">0/20</div>
      <div class="score-label">当前得分</div>
    </div>
  </section>

  <section class="toolbar">
    <div class="formula-card">
      <div class="formula-title">解题提醒</div>
      <div>不同时出发：先把“先走的人独走的路程”算出来，再按追及问题处理。</div>
      <div>距中点 x 米处相遇：两人路程差 = 2x，先求总相遇时间，再比较各自行程。</div>
      <div>多人相遇追及：分别找清楚每一组对象对应的路程差、速度差或速度和。</div>
    </div>
  </section>

  <section class="question-grid" id="questionGrid"></section>

  <section class="bottom-actions">
    <div class="save-status" id="saveStatus"></div>
    <div class="actions">
      <button class="btn btn-primary" id="checkBtn">批改</button>
      <button class="btn btn-secondary" id="resetBtn">重做</button>
      <button class="btn btn-secondary" id="saveBtn" disabled>保存成绩</button>
    </div>
  </section>
</div>

<script>
const config = {
  childId: 'yuxiao',
  taskId: 'track_meeting_variants',
  questions: [
    {
      tag: '直线同向追及·求时间',
      unit: '分钟',
      prompt: '甲在乙后方 150 米处，两人同时沿同一方向走路。甲每分钟走 75 米，乙每分钟走 50 米。甲经过多少分钟追上乙？',
      answer: 6,
      solution: '甲每分钟多走 75 - 50 = 25 米；要追 150 米，所以 150 ÷ 25 = 6 分钟。'
    },
    {
      tag: '直线同向追及·求时间',
      unit: '分钟',
      prompt: '小亮在小明后方 180 米处，两人同时同向骑车。小亮每分钟骑 90 米，小明每分钟骑 60 米。小亮经过多少分钟追上小明？',
      answer: 6,
      solution: '小亮每分钟多骑 90 - 60 = 30 米；要追 180 米，所以 180 ÷ 30 = 6 分钟。'
    },
    {
      tag: '不同时出发·求追上时间',
      unit: '分钟',
      prompt: '甲、乙从同一地点沿同一方向走路，甲每分钟走 48 米，先出发 5 分钟；乙每分钟走 78 米，随后出发。乙出发后经过多少分钟追上甲？',
      answer: 8,
      solution: '甲先走 48 × 5 = 240 米；乙每分钟多走 78 - 48 = 30 米，所以 240 ÷ 30 = 8 分钟。'
    },
    {
      tag: '不同时出发·求追上时间',
      unit: '分钟',
      prompt: '弟弟每分钟走 55 米，从家门口先出发 6 分钟；哥哥每分钟走 88 米，随后从同一地点同向出发。哥哥出发后多少分钟追上弟弟？',
      answer: 10,
      solution: '弟弟先走 55 × 6 = 330 米；哥哥每分钟多走 88 - 55 = 33 米，所以 330 ÷ 33 = 10 分钟。'
    },
    {
      tag: '反求速度',
      unit: '米/分钟',
      prompt: '甲每分钟走 60 米，从同一地点先出发 6 分钟；乙随后出发，9 分钟追上甲。乙每分钟走多少米？',
      answer: 100,
      solution: '甲先走 60 × 6 = 360 米；乙 9 分钟要多追 360 米，每分钟多走 360 ÷ 9 = 40 米，所以乙速 60 + 40 = 100 米/分钟。'
    },
    {
      tag: '反求先走时间',
      unit: '分钟',
      prompt: '甲每分钟走 50 米，先出发；乙每分钟走 75 米，乙出发后 8 分钟追上甲。甲先出发了多少分钟？',
      answer: 4,
      solution: '乙每分钟多走 75 - 50 = 25 米；8 分钟追上的领先路程是 25 × 8 = 200 米；甲先走时间 200 ÷ 50 = 4 分钟。'
    },
    {
      tag: '相向相遇·求时间',
      unit: '分钟',
      prompt: '甲、乙两地相距 480 米，小林每分钟走 45 米，小周每分钟走 35 米，两人同时相向而行。多少分钟后相遇？',
      answer: 6,
      solution: '两人相向而行，用速度和：45 + 35 = 80 米/分钟；480 ÷ 80 = 6 分钟。'
    },
    {
      tag: '相向相遇·求时间',
      unit: '分钟',
      prompt: '两辆小车从相距 660 米的两端同时相向开出，一辆每分钟行 60 米，另一辆每分钟行 50 米。多少分钟后相遇？',
      answer: 6,
      solution: '速度和是 60 + 50 = 110 米/分钟；660 ÷ 110 = 6 分钟。'
    },
    {
      tag: '距中点相遇·求偏离距离',
      unit: '米',
      prompt: '甲、乙两地相距 720 米，甲每分钟走 70 米，乙每分钟走 50 米，两人同时相向而行。相遇点距离两地中点多少米？',
      answer: 60,
      solution: '相遇时间 720 ÷ (70 + 50) = 6 分钟；两人路程差 (70 - 50) × 6 = 120 米，所以距中点 120 ÷ 2 = 60 米。'
    },
    {
      tag: '距中点相遇·求偏离距离',
      unit: '米',
      prompt: '东、西两站相距 900 米，小东每分钟走 85 米，小西每分钟走 65 米，两人同时相向出发。相遇点距离两站中点多少米？',
      answer: 60,
      solution: '相遇时间 900 ÷ (85 + 65) = 6 分钟；路程差 (85 - 65) × 6 = 120 米，所以距中点 120 ÷ 2 = 60 米。'
    },
    {
      tag: '环形同向·套圈',
      unit: '秒',
      prompt: '420 米环形跑道上，甲、乙从同一起点同时同向跑，甲每秒跑 10 米，乙每秒跑 7 米。甲经过多少秒第一次套乙一圈？',
      answer: 140,
      solution: '甲要比乙多跑一整圈 420 米；速度差是 10 - 7 = 3 米/秒，所以 420 ÷ 3 = 140 秒。'
    },
    {
      tag: '环形同向·套圈',
      unit: '秒',
      prompt: '360 米环形跑道上，甲、乙从同一起点同时同向跑，甲每秒跑 11 米，乙每秒跑 8 米。甲经过多少秒第一次套乙一圈？',
      answer: 120,
      solution: '甲要比乙多跑 360 米；速度差是 11 - 8 = 3 米/秒，所以 360 ÷ 3 = 120 秒。'
    },
    {
      tag: '环形反向·相遇',
      unit: '秒',
      prompt: '420 米环形跑道上，甲、乙从同一起点同时反向跑。甲每秒跑 8 米，乙每秒跑 6 米。多少秒后两人再次相遇？',
      answer: 30,
      solution: '反向跑用速度和：8 + 6 = 14 米/秒；一圈 420 米，所以 420 ÷ 14 = 30 秒。'
    },
    {
      tag: '环形反向·相遇',
      unit: '秒',
      prompt: '400 米环形跑道上，甲、乙分别在相距 240 米的两点，沿较短弧线相向出发。甲每秒跑 9 米，乙每秒跑 7 米。多少秒后第一次相遇？',
      answer: 15,
      solution: '两人相向而行，用速度和：9 + 7 = 16 米/秒；相距 240 米，所以 240 ÷ 16 = 15 秒。'
    },
    {
      tag: '第 n 次追上',
      unit: '秒',
      prompt: '400 米环形跑道上，甲、乙从同一起点同时同向跑，甲每秒跑 9 米，乙每秒跑 5 米。甲第 3 次追上乙是在出发后多少秒？',
      answer: 300,
      solution: '每次追上都要多跑一圈，400 ÷ (9 - 5) = 100 秒一次；第 3 次是 100 × 3 = 300 秒。'
    },
    {
      tag: '第 n 次追上',
      unit: '秒',
      prompt: '480 米环形跑道上，甲每秒跑 6 米，先跑 20 秒；乙每秒跑 10 米，随后同向出发。乙出发后第 3 次追上甲要多少秒？',
      answer: 270,
      solution: '甲先跑 6 × 20 = 120 米；第一次追上用 120 ÷ (10 - 6) = 30 秒；以后每次多一圈用 480 ÷ 4 = 120 秒。第 3 次：30 + 2 × 120 = 270 秒。'
    },
    {
      tag: '多人追及·最先追上',
      unit: '秒',
      prompt: '甲、乙、丙在同一直线上同向跑，甲在最后，乙在甲前方 120 米，丙在甲前方 240 米。甲、乙、丙速度分别为 10 米/秒、8 米/秒、7 米/秒。甲最先追上其中一人要多少秒？',
      answer: 60,
      solution: '甲追乙：120 ÷ (10 - 8) = 60 秒；甲追丙：240 ÷ (10 - 7) = 80 秒，所以最先追上乙。'
    },
    {
      tag: '多人追及·最先追上',
      unit: '秒',
      prompt: '甲、乙、丙在同一直线上同向跑，甲在最后，乙在甲前方 150 米，丙在甲前方 280 米。甲、乙、丙速度分别为 12 米/秒、9 米/秒、8 米/秒。甲最先追上其中一人要多少秒？',
      answer: 50,
      solution: '甲追乙：150 ÷ (12 - 9) = 50 秒；甲追丙：280 ÷ (12 - 8) = 70 秒，所以最先追上乙。'
    },
    {
      tag: '多人同时追上·最小公倍数',
      unit: '秒',
      prompt: '360 米环形跑道上，甲、乙、丙从同一起点同时同向跑，速度分别是 10 米/秒、7 米/秒、6 米/秒。甲第一次同时追上乙和丙是在出发后多少秒？',
      answer: 360,
      solution: '甲追乙周期：360 ÷ (10 - 7) = 120 秒；甲追丙周期：360 ÷ (10 - 6) = 90 秒；120 和 90 的最小公倍数是 360。'
    },
    {
      tag: '多人同时追上·最小公倍数',
      unit: '秒',
      prompt: '420 米环形跑道上，甲、乙、丙从同一起点同时同向跑，速度分别是 11 米/秒、8 米/秒、5 米/秒。甲第一次同时追上乙和丙是在出发后多少秒？',
      answer: 140,
      solution: '甲追乙周期：420 ÷ (11 - 8) = 140 秒；甲追丙周期：420 ÷ (11 - 5) = 70 秒；140 和 70 的最小公倍数是 140。'
    }
  ]

};

const stateKey = `smartway.trackMeeting.${config.childId}.answers`;
const questionSignature = JSON.stringify(config.questions.map(question => ({
  tag: question.tag,
  unit: question.unit,
  prompt: question.prompt,
  answer: question.answer
})));
let lastResult = null;

const questionGridEl = document.getElementById('questionGrid');
const scoreEl = document.getElementById('score');
const checkBtn = document.getElementById('checkBtn');
const resetBtn = document.getElementById('resetBtn');
const saveBtn = document.getElementById('saveBtn');
const saveStatusEl = document.getElementById('saveStatus');

function loadAnswers() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(stateKey) || 'null');
    if (!saved) return [];
    if (Array.isArray(saved) || saved.signature !== questionSignature || !Array.isArray(saved.answers)) {
      sessionStorage.removeItem(stateKey);
      return [];
    }
    return saved.answers;
  } catch (error) {
    sessionStorage.removeItem(stateKey);
    return [];
  }
}

function saveAnswers() {
  const answers = [...questionGridEl.querySelectorAll('.answer-input')].map(input => input.value);
  sessionStorage.setItem(stateKey, JSON.stringify({ signature: questionSignature, answers }));
  saveStatusEl.textContent = '答案已自动保留';
}

function normalizeAnswer(value) {
  return value.trim().replace(/米\/分钟|分钟|秒|米/g, '').trim();
}

function isCorrectAnswer(inputValue, expected) {
  const answer = Number(normalizeAnswer(inputValue));
  return Number.isFinite(answer) && Math.abs(answer - expected) < 1e-8;
}

function renderQuestions() {
  const savedAnswers = loadAnswers();
  questionGridEl.innerHTML = '';

  config.questions.forEach((question, index) => {
    const card = document.createElement('article');
    card.className = 'question-card';
    card.dataset.index = index;

    const head = document.createElement('div');
    head.className = 'question-head';

    const num = document.createElement('div');
    num.className = 'question-index';
    num.textContent = `第 ${index + 1} 题`;

    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.textContent = question.tag;

    const prompt = document.createElement('div');
    prompt.className = 'prompt';

    const line = document.createElement('div');
    line.className = 'prompt-line';
    line.textContent = question.prompt;

    const answerRow = document.createElement('div');
    answerRow.className = 'answer-row';

    const input = document.createElement('input');
    input.className = 'answer-input';
    input.type = 'text';
    input.inputMode = 'decimal';
    input.placeholder = `填写${question.unit}`;
    input.autocomplete = 'off';
    input.value = savedAnswers[index] || '';
    input.addEventListener('input', saveAnswers);
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') checkAll();
    });

    const unit = document.createElement('span');
    unit.className = 'unit';
    unit.textContent = question.unit;

    const feedback = document.createElement('div');
    feedback.className = 'feedback';

    const solution = document.createElement('div');
    solution.className = 'solution';

    head.append(num, badge);
    prompt.append(line);
    answerRow.append(input, unit);
    card.append(head, prompt, answerRow, feedback, solution);
    questionGridEl.appendChild(card);
  });
}

function checkAll() {
  saveAnswers();
  let correct = 0;
  let answered = 0;
  const wrongItems = [];

  questionGridEl.querySelectorAll('.question-card').forEach(card => {
    const index = Number(card.dataset.index);
    const question = config.questions[index];
    const input = card.querySelector('.answer-input');
    const feedback = card.querySelector('.feedback');
    const solution = card.querySelector('.solution');
    const value = normalizeAnswer(input.value);

    if (!value) {
      card.classList.remove('correct', 'wrong');
      feedback.textContent = '';
      solution.textContent = '';
      return;
    }

    answered += 1;
    const ok = isCorrectAnswer(value, question.answer);
    card.classList.toggle('correct', ok);
    card.classList.toggle('wrong', !ok);

    if (ok) {
      correct += 1;
      feedback.textContent = '正确';
      solution.textContent = '';
    } else {
      feedback.textContent = `错误，正确答案：${question.answer}${question.unit}`;
      solution.textContent = question.solution;
      wrongItems.push(`第 ${index + 1} 题：${question.prompt}`);
    }
  });

  lastResult = { correct, total: answered, wrongItems };
  scoreEl.textContent = `${correct}/${answered}`;
  saveBtn.disabled = answered === 0;
  saveStatusEl.textContent = answered === 0 ? '还没有填写答案' : `已批改 ${answered} 道题，可保存成绩`;
}

function resetAll() {
  lastResult = null;
  sessionStorage.removeItem(stateKey);
  scoreEl.textContent = `0/${config.questions.length}`;
  saveBtn.disabled = true;
  saveStatusEl.textContent = '';
  questionGridEl.querySelectorAll('.question-card').forEach(card => {
    card.classList.remove('correct', 'wrong');
    card.querySelector('.answer-input').value = '';
    card.querySelector('.feedback').textContent = '';
    card.querySelector('.solution').textContent = '';
  });
}

async function saveResult() {
  if (!lastResult) return;
  saveBtn.disabled = true;
  saveStatusEl.textContent = '正在保存...';

  try {
    const response = await fetch(`/api/children/${encodeURIComponent(config.childId)}/records`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        taskId: config.taskId,
        total: lastResult.total,
        correct: lastResult.correct,
        wrongItems: lastResult.wrongItems
      })
    });

    if (!response.ok) throw new Error(`保存失败：${response.status}`);
    saveStatusEl.textContent = '成绩已保存';
  } catch (error) {
    console.error(error);
    saveStatusEl.textContent = '保存失败，请确认后端服务正常';
    saveBtn.disabled = false;
  }
}

checkBtn.addEventListener('click', checkAll);
resetBtn.addEventListener('click', resetAll);
saveBtn.addEventListener('click', saveResult);

renderQuestions();
scoreEl.textContent = `0/${config.questions.length}`;
if (loadAnswers().some(Boolean)) {
  saveStatusEl.textContent = '已恢复上次填写的答案';
}
</script>
</body>
</html>
