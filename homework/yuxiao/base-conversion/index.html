<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>余晓进制转换</title>
<link rel="stylesheet" href="/shared/base-conversion-task.css" />
</head>
<body>
<div class="page">
  <section class="hero">
    <div>
      <div class="eyebrow">数学专项 · 进制转换</div>
      <h1 id="title">进制转换</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="score-card">
      <div class="score-number" id="score">0/8</div>
      <div class="score-label">当前得分</div>
    </div>
  </section>

  <section class="toolbar">
    <div class="tips">答案中十六进制可使用大写或小写，例如 <b>A8</b> / <b>a8</b> 都可以。填写内容会在当前浏览器会话中自动保留。</div>
  </section>

  <section class="question-grid" id="questionGrid"></section>

  <section class="bottom-actions">
    <div class="save-status" id="saveStatus"></div>
    <div class="actions">
      <button class="btn btn-primary" id="checkBtn">批改</button>
      <button class="btn btn-secondary" id="resetBtn">重做</button>
      <button class="btn btn-secondary" id="saveBtn" disabled>保存成绩</button>
    </div>
  </section>
</div>

<script>
window.BASE_CONVERSION_TASK = {
  childId: 'yuxiao',
  childName: '余晓',
  questions: [
    { fromBase: 10, toBase: 5, value: '73', answer: '243' },
    { fromBase: 10, toBase: 16, value: '156', answer: '9C' },
    { fromBase: 5, toBase: 10, value: '314', answer: '84' },
    { fromBase: 16, toBase: 10, value: '7A', answer: '122' },
    { fromBase: 5, toBase: 16, value: '432', answer: '75' },
    { fromBase: 16, toBase: 5, value: 'C7', answer: '1244' },
    { fromBase: 10, toBase: 5, value: '187', answer: '1222' },
    { fromBase: 10, toBase: 16, value: '239', answer: 'EF' }
  ]
};
</script>
<script src="/shared/base-conversion-task.js"></script>
</body>
</html>
